  <!--

  <style>
    :root{--void:#131313;--deep:#0e0e0e;--low:#1c1b1b;--mid:#201f1f;--high:#2a2a2a;--highest:#353534;--blood:#8b0000;--red:#ffb4a8;--ink:#e5e2e1;--muted:#c8c6c6;--meta:#bf9d97;--line:#5a403c;--paper:#dedbd6;--black:#191817}
    *{box-sizing:border-box}html,body,#root{min-height:100%;margin:0}body{font-family:"Work Sans",sans-serif;background:var(--paper);color:var(--black)}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:minmax(270px,340px) minmax(410px,1fr) minmax(260px,320px);gap:30px;padding:28px clamp(20px,3vw,52px);align-items:center;background:linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px),var(--paper);background-size:48px 100%}

nt:700 9px "Space Grotesk";letter-spacing:.08em;text-transform:uppercase}.pill.active{background:var(--highest);border-color:var(--red);color:var(--red)}
    .bottom{height:64px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(90,64,60,.5);background:var(--deep);flex:0 0 64px}.nav{border:0;background:transparent;color:#8e8582;font:700 8px "Space Grotesk";letter-spacing:.08em;text-transform:uppercase}.nav span{display:block;font-size:17px;margin-bottom:2px}.nav.active{color:var(--red)}.hero-action{display:grid;grid-template-columns:1fr 116px;gap:10px;margin-top:13px}.week-card{padding:14px;background:var(--low)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.day{height:28px;display:grid;place-items:center;background:var(--high);font:700 8px "Space Grotesk";color:#8f8582}.day.done{background:var(--blood);color:white}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(90,64,60,.4);margin-top:10px}.stat{background:var(--low);padding:10px 7px}.stat strong{display:block;font:700 18px "Space Grotesk";margin-top:4px}.list-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid rgba(90,64,60,.38)}.list-row strong{font:700 12px "Space Grotesk";text-transform:uppercase}.list-row small{display:block;color:var(--meta);margin-top:3px;font-size:10px}.resume{background:#261514;border-left:3px solid var(--red);padding:12px;margin-bottom:10px}.resume-actions{display:flex;gap:6px;margin-top:10px}.resume-actions button{flex:1}.ritual{padding:12px;background:var(--low);border-left:3px solid var(--blood);margin-bottom:6px}.ritual strong{font:700 12px "Space Grotesk";text-transform:uppercase}.ritual span{font-size:10px;color:var(--meta)}

lex;gap:5px;margin-top:8px}.logbar{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:10px 14px;background:var(--deep);border-top:1px solid rgba(90,64,60,.5)}.set-list{padding:0 14px 12px}.set-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:9px 0;border-top:1px solid rgba(90,64,60,.35)}.set-index{font:700 11px "Space Grotesk";color:var(--meta)}.set-load{font:700 12px "Space Grotesk"}.tag{padding:4px 6px;background:var(--high);color:var(--meta);font:700 7px "Space Grotesk";letter-spacing:.08em}.last{margin:8px 14px 12px;padding:10px;background:var(--low);border-left:3px solid var(--blood)}.last button{border:0;background:transparent;color:var(--red);font:700 9px "Space Grotesk";letter-spacing:.08em;padding:0;width:100%;text-align:left}.last-set{display:flex;justify-content:space-between;padding:7px;margin-top:5px;background:var(--deep);font-size:10px}.timer{position:absolute;inset:auto 12px 12px;background:#211615;border:1px solid var(--red);padding:14px;z-index:20;box-shadow:0 16px 40px rgba(0,0,0,.6)}.timer strong{font:700 34px "Space Grotesk"}.timer-actions{display:flex;gap:6px}.timer-actions button{flex:1}.pr{position:absolute;top:12px;left:12px;right:12px;background:var(--red);color:#30110e;padding:10px;font:700 11px "Space Grotesk";letter-spacing:.1em;text-align:center;z-index:22}
    .picker-search{margin:10px 14px 8px;height:46px;background:var(--deep);border:1px solid rgba(90,64,60,.55);color:var(--ink);padding:0 12px;width:calc(100% - 28px)}.hscroll{display:flex;gap:5px;overflow:auto;padding:0 14px 8px;scrollbar-width:none}.exercise-row{padding:11px 14px;border-top:1px solid rgba(90,64,60,.35)}.exercise-row strong{font:700 12px "Space Grotesk";text-transform:uppercase}.exercise-row span{display:block;color:var(--meta);font-size:9px;text-transform:uppercase;margin-top:2px}.recent{margin:0 14px 8px;padding:10px;background:#211817}.recent strong{font:700 10px "Space Grotesk"}.complete-overlay,.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px;z-index:25}.dialog{width:100%;background:var(--mid);border:1px solid rgba(255,180,168,.55);padding:18px;box-shadow:0 20px 50px #000}.dialog h2{font-size:28px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(90,64,60,.4);margin:14px 0}.summary div{background:var(--low);padding:10px}.summary b{display:block;font:700 15px "Space Grotesk"}.check{display:flex;align-items:center;gap:9px;padding:10px;background:var(--deep);margin-bottom:12px}.check input{accent-color:var(--blood)}
    .calendar{display:grid;grid-template-columns:32px repeat(7,1fr) 32px;gap:4px;margin:10px 0}.date{height:42px;background:var(--low);display:grid;place-items:center;font:700 8px "Space Grotesk";color:var(--meta)}.date.active{background:var(--blood);color:white}.date i{width:4px;height:4px;background:var(--red);border-radius:50%}.history-card{padding:12px 0;border-top:1px solid rgba(90,64,60,.4)}.history-card h3{font-size:13px}.delta{color:#8ed49a;font:700 9px "Space Grotesk"}.details{margin-top:10px;padding:9px;background:var(--deep)}.details-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-top:1px solid rgba(90,64,60,.3);font-size:10px}.actions{display:flex;gap:5px;margin-top:8px}.actions button{flex:1;min-height:34px}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(90,64,60,.4);margin-bottom:10px}.mode-tabs button{height:40px;border:0;background:var(--low);color:#8f8582;font:700 9px "Space Grotesk";letter-spacing:.1em;text-transform:uppercase}.mode-tabs button.active{background:var(--highest);color:var(--red)}.hero-metric{padding:15px;background:#211615;border-left:3px solid var(--red)}.hero-metric strong{display:block;font:700 34px "Space Grotesk"}.bars{height:104px;display:flex;align-items:end;gap:7px;padding-top:12px}.bar{flex:1;background:#493532;min-height:15px}.bar.hot{background:var(--blood)}.chart{padding:12px;background:var(--low);margin-top:8px}.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:10px}.heat i{aspect-ratio:1;background:#2a2524}.heat i:nth-child(4n),.heat i:nth-child(11n){background:#73302b}.heat i:nth-child(17n){background:var(--red)}.metric-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.metric-card{padding:11px;background:var(--low)}.metric-card b{display:block;font:700 17px "Space Grotesk";margin-top:3px}.profile-hero{padding:18px 14px;background:#211615}.avatar{width:54px;height:54px;display:grid;place-items:center;background:var(--blood);font:700 22px "Space Grotesk"}.profile-item{width:100%;display:flex;align-items:center;gap:12px;min-height:55px;padding:0 14px;border:0;border-top:1px solid rgba(90,64,60,.4);background:transparent;color:var(--ink);text-align:left}.profile-item b{font:700 11px "Space Grotesk";text-transform:uppercase}.profile-item small{display:block;color:var(--meta);margin-top:2px}.profile-item em{margin-left:auto;color:var(--red);font-style:normal}.subpage h2{font-size:24px}.progress{height:8px;background:var(--high);margin:10px 0}.progress i{display:block;height:100%;width:42%;background:var(--blood)}.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid rgba(90,64,60,.35);font-size:11px}.switch{width:38px;height:22px;padding:3px;background:var(--blood)}.switch:after{content:"";display:block;width:16px;height:16px;background:white;margin-left:16px}.brand-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.brand-card{padding:11px;background:var(--low);border:1px solid rgba(90,64,60,.45);font:700 9px "Space Grotesk"}.brand-card.on{border-color:var(--red);color:var(--red)}
    .coverage{align-self:center}.coverage h2{font:700 21px/1 "Space Grotesk";text-transform:uppercase;letter-spacing:-.025em;margin:0 0 8px}.coverage p{font-size:12px;line-height:1.45;color:#625c57;margin:0 0 12px}.domain{border-top:1px solid rgba(25,24,23,.18);padding:10px 0}.domain-head{display:flex;justify-content:space-between;font:700 10px "Space Grotesk";letter-spacing:.08em;text-transform:uppercase}.domain-head span{color:#8b0000}.domain ul{list-style:none;padding:0;margin:7px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}.domain li{font-size:10px;color:#5b5651}.domain li:before{content:"✓";color:#8b0000;margin-right:5px}.verified{margin-top:12px;padding:10px;background:#cbc6c0;font-size:10px;line-height:1.45}.verified b{font-family:"Space Grotesk"}.callout{position:absolute;left:calc(100% + 20px);top:40px;width:130px;color:#746e68;font:700 9px/1.45 "Space Grotesk";letter-spacing:.06em;text-transform:uppercase}.phone-wrap{position:relative}

<body><div id="root"></div>
<script type="text/babel">
  const {useMemo,useState}=React;
  const nav=[['altar','⌂','ALTAR'],['history','◷','WORKOUT'],['stats','▥','STATS'],['profile','●','PROFILE']];
  const exercises=[['Barbell Bench Press','Chest · Barbell'],['Barbell Back Squat','Legs · Barbell'],['Cable Crossover','Chest · Cable'],['Bulgarian Split Squat','Legs · Dumbbell'],['Barbell Row','Back · Barbell'],['Arnold Press','Shoulders · Dumbbell']];
  const findings={
    altar:[['Priority','Resume, templates and start-new remain first-class.'],['Density','Weekly goal + daily stats use one compact information zone.'],['Continuity','Recent sessions stay visible, not replaced by generic content.']],
    session:[['Core loop','Weight, reps and Log Set remain reachable without scrolling.'],['Pro controls','RPE/RIR, note, set type and plates are grouped, not removed.'],['Context','Exercises, last session, PR and timer remain in the same flow.']],
    picker:[['Filtering','Search, equipment, category and brand filters are retained.'],['Creation','OCR scan, recent exercises and custom exercise remain direct actions.'],['Speed','Dense rows are easier to scan one-handed.']],
    complete:[['Closure','Finish summary confirms what will be saved.'],['Templates','Save as Ritual remains an explicit opt-in.'],['Safety','Discard is separated from the primary save action.']],
    history:[['Calendar','The real 7-day picker and workout indicators remain.'],['Detail','Expand, rename, edit and delete remain available in context.'],['Comparison','Volume delta adds value without changing the archive model.']],
    stats:[['Two modes','Performance and Personal are both represented.'],['Hierarchy','Range, hero metric, progress, consistency and balance have a stable order.'],['Tools','1RM calculator stays a secondary tool, not a competing hero.']],
    profile:[['Hub','Weight Loss, My Gym, Backup and Settings remain discoverable.'],['System','Advanced tracking and units live in Settings.'],['Trust','Local data and backup controls stay visible.']]
  };
  function Frame({children}){return <div className="phone"><div className="screen"><div className="status"><span>19:47</span><span className="sys-icons">▮▮▮ ◔ <i className="battery"/></span></div><div className="punch"/><div className="app">{children}</div><div className="gesture"/></div></div>}
  function Top({title='TRACKGOD',meta='OFFLINE · PRIVATE',back,onBack,action}){return <div className="topbar">{back&&<button className="icon-btn" onClick={onBack}>‹</button>}<div className="brand">{title}</div><div className="meta">{meta}</div>{action}</div>}
  function Bottom({screen,setScreen}){return <div className="bottom">{nav.map(([id,icon,label])=><button key={id} className={'nav '+(screen===id?'active':'')} onClick={()=>setScreen(id)}><span>{icon}</span>{label}</button>)}</div>}
  function Altar({go}){const [incomplete,setIncomplete]=useState(true);return <div className="view"><Top/><div className="scroll pad">{incomplete&&<div className="resume"><div className="micro">UNFINISHED RITUAL · 34 MIN</div><h3 style={{marginTop:5}}>PUSH // 4 EXERCISES · 11 SETS</h3><div className="resume-actions"><button className="primary" onClick={()=>go('session')}>RESUME</button><button className="ghost" onClick={()=>setIncomplete(false)}>DISCARD</button></div></div>}<div className="hero-action"><div className="week-card"><div className="row between"><div><div className="micro">WEEKLY RITUAL</div><h3 style={{marginTop:5}}>2 OF 4 COMPLETE</h3></div><h2>50%</h2></div><div className="week">{'MTWTFSS'.split('').map((d,i)=><div className={'day '+(i===1||i===3?'done':'')} key={i}>{d}</div>)}</div></div><button className="primary" onClick={()=>go('session')}>START<br/>NEW →</button></div><div className="stats-grid">{[['STREAK','6','DAYS'],['VOLUME','12.8K','KG'],['SETS','18','TODAY'],['TIME','54','MIN']].map(x=><div className="stat" key={x[0]}><div className="micro">{x[0]}</div><strong>{x[1]}</strong><div className="micro">{x[2]}</div></div>)}</div><div className="section-title">SAVED RITUALS</div>{[['PUSH A','8 exercises'],['BACK + ARMS','7 exercises']].map(x=><button className="ritual full row between" onClick={()=>go('session')} key={x[0]}><strong>{x[0]}</strong><span>{x[1]} →</span></button>)}<div className="section-title">PAST TRANSMISSIONS</div>{[['PUSH','TODAY · 54 MIN · 18 SETS','12 859 KG'],['LEGS','THU · 61 MIN · 21 SETS','20 090 KG']].map(x=><div className="list-row" key={x[0]}><div><strong>{x[0]}</strong><small>{x[1]}</small></div><strong>{x[2]}</strong></div>)}</div><Bottom screen="altar" setScreen={go}/></div>}
  function Stepper({label,value,setValue,step=1,unit}){return <div className="num-control"><div className="micro">{label}</div><div className="stepper"><button onClick={()=>setValue(Math.max(0,value-step))}>−</button><div className="number">{value}<small>{unit}</small></div><button onClick={()=>setValue(value+step)}>+</button></div></div>}
  function Session({go}){const [weight,setWeight]=useState(80),[reps,setReps]=useState(8),[type,setType]=useState('WORK'),[advanced,setAdvanced]=useState(true),[last,setLast]=useState(true),[timer,setTimer]=useState(false),[pr,setPr]=useState(false),[sets,setSets]=useState([{load:'60 KG × 12',type:'WARM'},{load:'75 KG × 10',type:'WORK'},{load:'80 KG × 8',type:'WORK'}]);const types=['WORK','WARM','DROP','FAIL'];function log(){setSets([...sets,{load:`${weight} KG × ${reps}`,type}]);setTimer(type!=='WARM');setPr(weight>=85)}return <div className="view"><div className="session-head"><div className="row between"><div><span className="live">● LIVE · 00:47:12</span><h3>WORKOUT</h3></div><div className="row"><button className="icon-btn" onClick={()=>go('picker')}>＋</button><button className="ghost" style={{minHeight:38,padding:'0 12px'}} onClick={()=>go('complete')}>END</button></div></div><div className="telemetry">{[['EXERCISES','3'],['SETS',sets.length],['VOLUME','8.4K'],['TIME','47:12']].map(x=><div key={x[0]}><span className="micro">{x[0]}</span><b>{x[1]}</b></div>)}</div></div><div className="exercise-switcher"><button className="exercise-chip">Lat Pulldown</button><button className="exercise-chip active">Bench Press</button><button className="exercise-chip">Cable Fly</button></div><div className="scroll"><div className="exercise-title"><div className="micro">CHEST · BARBELL · EXERCISE 2/3</div><h2>BARBELL BENCH PRESS</h2></div><div className="suggestion">↗ PROGRESSIVE OVERLOAD · LAST 80 × 8 · TRY 82.5 × 8</div><div className="builder"><div className="num-grid"><Stepper label="WEIGHT" value={weight} setValue={setWeight} step={2.5} unit="KG"/><Stepper label="REPS" value={reps} setValue={setReps} unit="REPS"/></div><button className="advanced-toggle" onClick={()=>setAdvanced(!advanced)}>{advanced?'− HIDE':'＋ SHOW'} ADVANCED · RPE / RIR / NOTE / PLATES</button>{advanced&&<div className="advanced"><div className="input-card"><div className="micro">RPE</div><strong>8 / 10</strong></div><div className="input-card"><div className="micro">RIR</div><strong>2 REPS</strong></div><div className="input-card"><div className="micro">NOTE</div><strong>PAUSED REP</strong></div><div className="input-card"><div className="micro">PLATE CALC.</div><strong>20 + 10 + 2.5</strong></div></div>}<div className="type-row">{types.map(t=><button key={t} className={'pill '+(type===t?'active':'')} onClick={()=>setType(t)}>{t}</button>)}</div></div><div className="set-list"><div className="section-title">COMPLETED SETS · TAP TO EDIT</div>{sets.map((s,i)=><div className="set-row" key={i}><div className="set-index">{String(i+1).padStart(2,'0')}</div><div><div className="set-load">{s.load}</div><div className="micro">RPE {i+7} · RIR {Math.max(0,3-i)}</div></div><span className="tag">{s.type}</span></div>)}</div><div className="last"><button onClick={()=>setLast(!last)}>LAST SESSION ({last?'COLLAPSE':'3 SETS · EXPAND'})</button>{last&&[['SET 1','75 KG × 10'],['SET 2','80 KG × 8'],['SET 3','80 KG × 7']].map(x=><div className="last-set" key={x[0]}><span>{x[0]}</span><b>{x[1]}</b></div>)}</div></div><div className="logbar"><button className="pill active" onClick={()=>setType(types[(types.indexOf(type)+1)%types.length])}>{type}</button><button className="primary" onClick={log}>LOG SET {sets.length+1}</button></div>{timer&&<div className="timer"><div className="row between"><div><div className="micro">REST TIMER · AUTO START</div><strong>01:27</strong></div><button className="icon-btn" onClick={()=>setTimer(false)}>×</button></div><div className="timer-actions"><button className="secondary">−15</button><button className="secondary">PAUSE</button><button className="secondary">+15</button><button className="primary" onClick={()=>setTimer(false)}>SKIP</button></div></div>}{pr&&<div className="pr" onClick={()=>setPr(false)}>NEW PR · EST. 1RM 107.6 KG</div>}</div>}
  function Picker({go}){const [equipment,setEquipment]=useState('ALL'),[category,setCategory]=useState('ALL'),[brand,setBrand]=useState(false);return <div className="view"><Top title="SELECT WEAPON" meta="SCAN ◫" back onBack={()=>go('session')} action={<button className="icon-btn">＋</button>}/><input className="picker-search" placeholder="SEARCH EXERCISES..."/><div className="hscroll">{['ALL','MACHINE','FREE WEIGHT'].map(x=><button className={'pill '+(equipment===x?'active':'')} onClick={()=>setEquipment(x)} key={x}>{x}</button>)}</div>{equipment==='MACHINE'&&<div className="hscroll"><button className={'pill '+(brand?'active':'')} onClick={()=>setBrand(!brand)}>HAMMER STRENGTH</button><button className="pill">TECHNOGYM</button><button className="pill">PANATTA</button></div>}<div className="hscroll">{['ALL','CHEST','BACK','SHOULDERS','ARMS','LEGS','CORE'].map(x=><button className={'pill '+(category===x?'active':'')} onClick={()=>setCategory(x)} key={x}>{x}</button>)}</div><div className="recent"><div className="micro">RECENTLY USED</div><strong>BENCH PRESS · LAT PULLDOWN · CABLE FLY</strong></div><div className="scroll">{exercises.map(x=><button className="exercise-row full" onClick={()=>go('session')} key={x[0]}><strong>{x[0]}</strong><span>{x[1]} · TAP TO SELECT · HOLD TO RENAME / HIDE</span></button>)}</div><button className="primary full" style={{margin:14,width:'calc(100% - 28px)'}}>ADD CUSTOM EXERCISE</button></div>}
  function Complete({go}){const [ritual,setRitual]=useState(true);return <div className="view"><Session go={go}/><div className="complete-overlay"><div className="dialog"><div className="micro">SESSION VERIFIED</div><h2>RITUAL<br/>COMPLETE.</h2><div className="summary">{[['TIME','54:18'],['SETS','18'],['VOLUME','12.9K']].map(x=><div key={x[0]}><span className="micro">{x[0]}</span><b>{x[1]}</b></div>)}</div><label className="check"><input type="checkbox" checked={ritual} onChange={e=>setRitual(e.target.checked)}/><span><b>SAVE AS RITUAL</b><br/><small>Reuse 3 exercises next time</small></span></label><button className="primary full" onClick={()=>go('history')}>SAVE PUSH SESSION</button><button className="ghost full" style={{marginTop:7}} onClick={()=>go('session')}>BACK TO WORKOUT</button><button className="ghost full" style={{marginTop:7,color:'#ff8780'}}>DISCARD WORKOUT</button></div></div></div>}
  function History({go}){const [expanded,setExpanded]=useState(1),[query,setQuery]=useState('');const rows=[['PUSH','TODAY · 54 MIN · 18 SETS','12 859 KG','+8%'],['BACK + ARMS','THU · 67 MIN · 24 SETS','14 836 KG','+3%'],['LEGS','MON · 52 MIN · 23 SETS','20 090 KG','−2%']];return <div className="view"><Top title="TRAINING LOG" meta="VERIFIED HISTORY"/><div className="scroll pad"><input className="picker-search" style={{margin:'0 0 8px',width:'100%'}} placeholder="SEARCH WORKOUTS..." value={query} onChange={e=>setQuery(e.target.value)}/><div className="calendar"><div className="date">‹</div>{['M 06','T 07','W 08','T 09','F 10','S 11','S 12'].map((x,i)=><div className={'date '+(i===5?'active':'')} key={x}><span>{x}</span>{(i===1||i===3||i===5)&&<i/>}</div>)}<div className="date">›</div></div><div className="section-title">3 TRANSMISSIONS</div>{rows.map((x,i)=><div className="history-card" key={x[0]} onClick={()=>setExpanded(expanded===i?-1:i)}><div className="row between"><div><h3>{x[0]}</h3><div className="micro" style={{marginTop:4}}>{x[1]}</div></div><div style={{textAlign:'right'}}><h3>{x[2]}</h3><div className="delta">{x[3]} VS LAST</div></div></div>{expanded===i&&<div className="details"><div className="micro">EXERCISES & SETS</div>{[['Bench Press','4 sets · 80 kg × 8'],['Cable Fly','3 sets · 27.5 kg × 12'],['Triceps Pushdown','4 sets · 35 kg × 10']].map(y=><div className="details-row" key={y[0]}><b>{y[0]}</b><span>{y[1]}</span></div>)}<div className="actions"><button className="secondary">RENAME</button><button className="secondary">EDIT</button><button className="ghost">DELETE</button></div></div>}</div>)}</div><Bottom screen="history" setScreen={go}/></div>}
  function Stats({go}){const [mode,setMode]=useState('performance'),[range,setRange]=useState('MO');return <div className="view"><Top title="STATS" meta="ARSENAL ANALYTICS"/><div className="scroll pad"><div className="mode-tabs"><button className={mode==='performance'?'active':''} onClick={()=>setMode('performance')}>PERFORMANCE</button><button className={mode==='personal'?'active':''} onClick={()=>setMode('personal')}>PERSONAL</button></div>{mode==='performance'?<><div className="hscroll" style={{padding:0,marginBottom:8}}>{['WK','MO','QTR','YR','ALL'].map(x=><button className={'pill '+(range===x?'active':'')} onClick={()=>setRange(x)} key={x}>{x}</button>)}</div><div className="hero-metric"><div className="micro">TOTAL VOLUME · {range}</div><strong>184.6K</strong><div className="micro">KG LIFTED · +12.4% VS PREVIOUS</div></div><div className="chart"><div className="row between"><h3>VOLUME PROGRESSION</h3><span className="delta">BEST 52.1K</span></div><div className="bars">{[36,58,74,64,92,82].map((h,i)=><i className={'bar '+(i>3?'hot':'')} style={{height:h+'%'}} key={i}/>)}</div></div><div className="metric-list"><div className="metric-card"><div className="micro">PERSONAL RECORDS</div><b>BENCH 107.6</b><small>EST. 1RM · +4.2%</small></div><div className="metric-card"><div className="micro">CONSISTENCY</div><b>6 DAY STREAK</b><small>3.8 workouts / week</small></div></div><div className="chart"><div className="row between"><h3>90 DAY HEATMAP</h3><span className="micro">34 SESSIONS</span></div><div className="heat">{Array.from({length:60}).map((_,i)=><i key={i}/>)}</div></div><div className="metric-list"><div className="metric-card"><div className="micro">STRENGTH BALANCE</div><b>PUSH 48%</b><small>Pull 52% · balanced</small></div><div className="metric-card"><div className="micro">TOP MUSCLE GROUP</div><b>CHEST 28%</b><small>of total volume</small></div></div><button className="secondary full" style={{marginTop:8}}>OPEN 1RM CALCULATOR</button></>:<><div className="   function Profile({go}){const [sub,setSub]=useState(null);return <div className="view"><Top title="PROFILE" meta="LOCAL ACCOUNT"/><div className="scroll"><div className="profile-hero row gap"><div className="avatar">C</div><div><h2>CODEX</h2><div className="micro">118 DAYS · 42 WORKOUTS</div></div></div>{[['ACCOUNT','Edit profile','Name, avatar, personal baseline','edit'],['GOALS','Weight Loss Journey','Goal, weigh-ins, milestones, photos','weight'],['DATA','Backup & Restore','DB backup, import, export, CSV','backup'],['DATA','My Gym','Machine brands and exercise visibility','gym'],['APP','Settings','Rest timer, RPE/RIR, units, reminders','settings'],['LEGAL','Privacy Policy','Local-first data policy','privacy']].map(x=><button className="profile-item" key={x[1]} onClick={()=>setSub(x[3])}><span className="micro">{x[0]}</span><span><b>{x[1]}</b><small>{x[2]}</small></span><em>→</em></button>)}</div><Bottom screen="profile" setScreen={go}/>{sub&&<Subpage type={sub} close={()=>setSub(null)}/>}</div>}

  function Coverage(){const data=[['ALTAR','8/8',['Resume/Discard','Weekly goal','Saved Rituals','Recent workouts']],['SESSION','13/13',['Set types','RPE + RIR','Notes + plates','Timer + PR','Supersets','Last session']],['PICKER','7/7',['Search','Categories','Equipment','Brands','Recent','OCR + custom']],['HISTORY','6/6',['7-day picker','Search','Expand','Rename/Edit','Delete','Volume delta']],['STATS','10/10',['Performance','Personal','5 ranges','PRs + 1RM','Heatmap','Balance']],['PROFILE','8/8',['Weight Loss','Photos','Milestones','My Gym','Backup','Settings']]];return <aside className="coverage"><div className="kicker">REAL APP COVERAGE</div><h2>Nothing important<br/>was designed away.</h2><p>Coverage is mapped against the actual Compose screens and ViewModel state, not the Play Store screenshots.</p>{data.map(x=><div className="domain" key={x[0]}><div className="domain-head">{x[0]} <span>{x[1]}</span></div><ul>{x[2].map(y=><li key={y}>{y}</li>)}</ul></div>)}<div className="verified"><b>Runtime verified</b><br/>Pixel 8 API 35 · TrackGod 2.0.5 · onboarding, seeding, Altar, empty session, picker and active exercise.</div></aside>}
