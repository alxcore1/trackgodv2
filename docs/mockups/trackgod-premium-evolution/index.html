<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackGod · Premium Evolution Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!--
    Annahmen:
    - Evolution statt Rebranding; TrackGod bleibt roh, dunkel und kompromisslos.
    - Der tägliche Kernweg ist Altar → Session → Satz loggen → Fortschritt prüfen.
    - Rot trägt Bedeutung: Primäraktion, aktive Navigation, Live-Status.
    - Mockdaten stammen aus den vorhandenen Projekt-Screenshots.

    Designziel:
    - weniger visuelle Dauerlautstärke, klarere Hierarchie und ruhigere Flächen
    - mindestens 44px große Touch-Ziele
    - wiederverwendbare Typografie- und Spacing-Tokens statt Screen-Sonderwerte
  -->
  <style>
    :root {
      --void: #131313;
      --void-deep: #0e0e0e;
      --surface-low: #1c1b1b;
      --surface-mid: #201f1f;
      --surface-high: #2a2a2a;
      --surface-highest: #353534;
      --blood: #8b0000;
      --blood-bright: #ffb4a8;
      --text-primary: #e5e2e1;
      --text-secondary: #c8c6c6;
      --text-tertiary: #bf9d97;
      --ghost: #5a403c;
      --screen-gap: 16px;
      --section-gap: 20px;
      --label-track: 0.16em;
      --texture-opacity: 0.035;
    }
    * { box-sizing: border-box; }
    html, body, #root { min-height: 100%; margin: 0; }
    body {
      background: #d9d6d2;
      color: #191817;
      font-family: "Work Sans", sans-serif;
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .prototype-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(300px, 390px) minmax(500px, 1fr);
      gap: 48px;
      padding: 36px clamp(24px, 5vw, 80px);
      align-items: center;
      background:
        linear-gradient(90deg, rgba(19,19,19,.045) 1px, transparent 1px),
        #d9d6d2;
      background-size: 48px 100%;
    }
    .brief-panel { max-width: 390px; }
    .eyebrow {
      font: 700 11px/1 "Space Grotesk", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #6b1b18;
      margin-bottom: 18px;
    }
    .brief-panel h1 {
      font: 700 clamp(38px, 4vw, 62px)/.93 "Space Grotesk", sans-serif;
      letter-spacing: -.055em;
      text-transform: uppercase;
      margin: 0 0 18px;
      text-wrap: balance;
    }
    .brief-panel > p {
      max-width: 36ch;
      font-size: 16px;
      line-height: 1.55;
      color: #4f4b47;
      margin: 0 0 28px;
      text-wrap: pretty;
    }
    .control-block { border-top: 1px solid rgba(25,24,23,.2); padding-top: 18px; margin-top: 18px; }
    .control-label {
      font: 700 10px/1 "Space Grotesk", sans-serif;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: #6a6560;
      margin-bottom: 10px;
    }
    .segmented { display: flex; flex-wrap: wrap; gap: 6px; }
    .shell-button {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid rgba(25,24,23,.22);
      background: transparent;
      color: #2f2c29;
      cursor: pointer;
      font: 700 11px/1 "Space Grotesk", sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .shell-button.active { background: #191817; color: #f1efec; border-color: #191817; }
    .mode-copy {
      min-height: 44px;
      color: #5e5954;
      font-size: 13px;
      line-height: 1.45;
      margin-top: 10px;
      max-width: 38ch;
    }
    .change-list { margin: 22px 0 0; padding: 0; list-style: none; }
    .change-list li {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid rgba(25,24,23,.14);
      color: #4f4b47;
      font-size: 13px;
      line-height: 1.4;
    }
    .change-list strong { color: #191817; font-family: "Space Grotesk", sans-serif; }
    .change-index { color: #8b0000; font: 700 11px/1.4 "Space Grotesk", sans-serif; }
    .stage { display: flex; justify-content: center; align-items: center; min-width: 0; }
    .phone-wrap { position: relative; }
    .flow-hint {
      position: absolute;
      top: 22px;
      right: -154px;
      width: 134px;
      font: 700 10px/1.45 "Space Grotesk", sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #6a6560;
    }
    .flow-hint::before { content: ""; position: absolute; left: -28px; top: 5px; width: 20px; height: 1px; background: #8b0000; }

    /* App design system */
    .tg-app {
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      position: relative;
      height: 100%;
      background: var(--void);
      color: var(--text-primary);
      font-family: "Work Sans", sans-serif;
      overflow: hidden;
    }
    .tg-app::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      opacity: var(--texture-opacity);
      background-image:
        repeating-linear-gradient(112deg, transparent 0 53px, rgba(255,255,255,.28) 54px, transparent 55px),
        repeating-linear-gradient(23deg, transparent 0 91px, rgba(255,255,255,.2) 92px, transparent 93px);
      mix-blend-mode: screen;
    }
    .tg-app.mode-compact { --screen-gap: 12px; --section-gap: 14px; --label-track: .12em; }
    .tg-app.mode-cinematic { --screen-gap: 18px; --section-gap: 24px; --label-track: .2em; --texture-opacity: .065; }
    .app-screen { height: 100%; display: flex; flex-direction: column; position: relative; z-index: 2; }
    .app-scroll { flex: 1; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
    .app-scroll::-webkit-scrollbar { display: none; }
    .app-header {
      height: 52px;
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--screen-gap);
      background: var(--void-deep);
      border-bottom: 1px solid rgba(90,64,60,.28);
    }
    .brand-lockup { display: flex; align-items: center; gap: 9px; }
    .brand-lockup img { width: 28px; height: 28px; display: block; }
    .brand-lockup span { font: 700 17px/1 "Space Grotesk", sans-serif; letter-spacing: -.04em; }
    .header-meta { font: 700 9px/1 "Space Grotesk", sans-serif; letter-spacing: .16em; color: var(--text-tertiary); text-transform: uppercase; }
    .screen-content { padding: var(--screen-gap); }
    .micro { font: 700 9px/1.2 "Space Grotesk", sans-serif; letter-spacing: var(--label-track); text-transform: uppercase; color: var(--text-tertiary); }
    .section-title { font: 700 11px/1.2 "Space Grotesk", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--text-secondary); }
    .display { font: 700 34px/.95 "Space Grotesk", sans-serif; letter-spacing: -.05em; text-transform: uppercase; }
    .mode-cinematic .display { font-size: 40px; }
    .title { font: 700 18px/1.05 "Space Grotesk", sans-serif; letter-spacing: -.025em; text-transform: uppercase; }
    .body { font-size: 13px; line-height: 1.45; color: var(--text-secondary); }
    .surface { background: var(--surface-low); }
    .divider { height: 1px; background: rgba(90,64,60,.35); }
    .hero-copy { margin: 6px 0 18px; }
    .hero-copy .micro { margin-bottom: 8px; }
    .primary-action {
      width: 100%; min-height: 74px; border: 0; color: var(--text-primary); background: var(--blood);
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 14px 16px;
      cursor: pointer; text-align: left; transition: transform 80ms ease, background 120ms ease;
    }
    .primary-action:active { transform: scale(.985); background: #690000; }
    .action-kicker { font: 600 10px/1.2 "Space Grotesk", sans-serif; letter-spacing: .15em; text-transform: uppercase; color: var(--blood-bright); }
    .action-title { margin-top: 4px; font: 700 20px/1 "Space Grotesk", sans-serif; letter-spacing: -.03em; text-transform: uppercase; }
    .action-arrow { width: 44px; height: 44px; display: grid; place-items: center; background: var(--text-primary); color: var(--blood); }
    .weekly { margin-top: var(--section-gap); padding: 14px 0 2px; }
    .weekly-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .weekly-value { font: 700 20px/1 "Space Grotesk", sans-serif; color: var(--blood-bright); }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .day { min-height: 40px; display: grid; place-items: center; background: var(--surface-low); color: var(--text-tertiary); font: 700 9px/1 "Space Grotesk", sans-serif; }
    .day.done { background: var(--surface-high); color: var(--text-primary); box-shadow: inset 0 -3px var(--blood); }
    .metrics { margin-top: var(--section-gap); display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-low); }
    .metric { padding: 14px 12px; border-right: 1px solid rgba(90,64,60,.28); }
    .metric:last-child { border-right: 0; }
    .metric-value { margin-top: 8px; font: 700 23px/1 "Space Grotesk", sans-serif; letter-spacing: -.04em; }
    .metric-unit { font-size: 9px; color: var(--text-tertiary); margin-left: 3px; letter-spacing: .08em; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin: var(--section-gap) 0 10px; }
    .text-action { border: 0; background: transparent; color: var(--blood-bright); min-height: 44px; padding: 0 4px; cursor: pointer; font: 700 9px/1 "Space Grotesk", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .workout-row { min-height: 68px; display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface-low); margin-bottom: 8px; }
    .date-block { font: 700 10px/1.1 "Space Grotesk", sans-serif; text-align: center; color: var(--text-tertiary); }
    .date-block strong { display: block; color: var(--text-primary); font-size: 18px; margin-top: 2px; }
    .workout-name { font: 700 14px/1.1 "Space Grotesk", sans-serif; text-transform: uppercase; }
    .workout-meta { margin-top: 5px; font-size: 10px; color: var(--text-tertiary); letter-spacing: .05em; }
    .workout-volume { text-align: right; font: 700 15px/1 "Space Grotesk", sans-serif; }
    .workout-volume span { display: block; margin-top: 4px; font-size: 8px; color: var(--text-tertiary); letter-spacing: .12em; }
    .bottom-nav { height: 62px; flex: 0 0 62px; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--void-deep); border-top: 1px solid rgba(90,64,60,.25); }
    .nav-item { border: 0; background: transparent; color: rgba(191,157,151,.58); cursor: pointer; min-width: 0; position: relative; display: grid; place-items: center; align-content: center; gap: 4px; }
    .nav-item.active { color: var(--blood-bright); }
    .nav-item.active::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--blood); }
    .nav-item span { font: 700 8px/1 "Space Grotesk", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .icon { width: 20px; height: 20px; display: block; }

    /* Session */
    .session-bar { height: 56px; flex: 0 0 56px; padding: 0 14px; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; background: var(--void-deep); border-bottom: 1px solid rgba(90,64,60,.28); }
    .icon-button { width: 44px; height: 44px; border: 0; background: transparent; color: var(--text-secondary); display: grid; place-items: center; cursor: pointer; }
    .session-title { text-align: center; }
    .session-title strong { display: block; font: 700 13px/1 "Space Grotesk", sans-serif; letter-spacing: .1em; }
    .session-time { margin-top: 5px; font: 600 10px/1 "Space Grotesk", sans-serif; letter-spacing: .1em; color: var(--text-tertiary); }
    .live { display: inline-flex; align-items: center; gap: 6px; }
    .live::before { content: ""; width: 7px; height: 7px; background: var(--blood); animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.75); } }
    .exercise-head { padding: 18px var(--screen-gap) 14px; }
    .exercise-head .title { max-width: 320px; margin: 7px 0 8px; font-size: 22px; line-height: 1.03; }
    .mode-compact .exercise-head .title { font-size: 19px; }
    .suggestion { margin: 0 var(--screen-gap); padding: 11px 12px; background: var(--surface-low); display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
    .suggestion strong { color: var(--blood-bright); font: 700 11px/1.2 "Space Grotesk", sans-serif; letter-spacing: .05em; }
    .set-builder { padding: 18px var(--screen-gap) 12px; }
    .number-grid { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 16px; align-items: stretch; }
    .number-control { text-align: center; }
    .step-row { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; margin-top: 8px; background: var(--surface-low); }
    .step-button { width: 48px; height: 56px; border: 0; background: var(--surface-mid); color: var(--blood-bright); font: 500 27px/1 "Space Grotesk", sans-serif; cursor: pointer; }
    .step-button:active { background: var(--surface-highest); }
    .number-value { font: 700 28px/1 "Space Grotesk", sans-serif; letter-spacing: -.04em; }
    .number-value small { display: block; margin-top: 6px; font: 700 8px/1 "Space Grotesk", sans-serif; letter-spacing: .16em; color: var(--text-tertiary); }
    .builder-divider { background: rgba(90,64,60,.32); }
    .set-options { margin-top: 14px; display: grid; grid-template-columns: auto 1fr; gap: 8px; }
    .set-type { min-width: 78px; height: 48px; border: 1px solid rgba(90,64,60,.4); background: transparent; color: var(--text-secondary); cursor: pointer; font: 700 9px/1 "Space Grotesk", sans-serif; letter-spacing: .12em; }
    .log-button { height: 48px; border: 0; background: var(--blood); color: var(--text-primary); cursor: pointer; font: 700 12px/1 "Space Grotesk", sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    .log-button.logged { background: var(--text-primary); color: var(--blood); }
    .set-list { padding: 0 var(--screen-gap) 18px; }
    .set-row { min-height: 48px; display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; border-top: 1px solid rgba(90,64,60,.28); }
    .set-index { color: var(--text-tertiary); font: 700 10px/1 "Space Grotesk", sans-serif; }
    .set-load { font: 700 13px/1 "Space Grotesk", sans-serif; }
    .set-note { font-size: 10px; color: var(--text-tertiary); }
    .toast { position: absolute; left: 16px; right: 16px; bottom: 18px; z-index: 20; min-height: 52px; display: flex; align-items: center; justify-content: center; background: var(--text-primary); color: var(--void); font: 700 11px/1 "Space Grotesk", sans-serif; letter-spacing: .12em; animation: toast-in 180ms ease-out; }
    @keyframes toast-in { from { transform: translateY(12px); opacity: 0; } }

    /* History + stats */
    .screen-heading { display: flex; align-items: end; justify-content: space-between; padding: 18px var(--screen-gap) 12px; }
    .screen-heading .display { font-size: 30px; }
    .period-tabs { margin: 0 var(--screen-gap) 14px; display: grid; grid-template-columns: repeat(3,1fr); background: var(--surface-low); }
    .period-tabs button { min-height: 44px; border: 0; color: var(--text-tertiary); background: transparent; cursor: pointer; font: 700 9px/1 "Space Grotesk", sans-serif; letter-spacing: .12em; }
    .period-tabs button.active { background: var(--surface-highest); color: var(--text-primary); box-shadow: inset 0 -3px var(--blood); }
    .summary-strip { margin: 0 var(--screen-gap) var(--section-gap); display: grid; grid-template-columns: repeat(3,1fr); background: var(--surface-low); }
    .summary-strip > div { padding: 12px; border-right: 1px solid rgba(90,64,60,.26); }
    .summary-strip > div:last-child { border-right: 0; }
    .summary-strip strong { display: block; margin-top: 7px; font: 700 17px/1 "Space Grotesk", sans-serif; }
    .history-list { padding: 0 var(--screen-gap) 20px; }
    .history-list .workout-row:first-of-type { box-shadow: inset 3px 0 var(--blood); }
    .stat-hero { margin: 0 var(--screen-gap); padding: 18px 0 16px; border-top: 1px solid rgba(90,64,60,.34); border-bottom: 1px solid rgba(90,64,60,.34); display: flex; justify-content: space-between; align-items: end; }
    .stat-hero strong { font: 700 42px/.9 "Space Grotesk", sans-serif; letter-spacing: -.06em; }
    .stat-hero small { font: 700 9px/1 "Space Grotesk", sans-serif; letter-spacing: .14em; color: var(--text-tertiary); }
    .chart-card { margin: var(--section-gap) var(--screen-gap) 0; padding: 16px 14px 14px; background: var(--surface-low); }
    .bar-chart { height: 150px; display: flex; align-items: end; gap: 6px; margin-top: 18px; border-bottom: 1px solid rgba(90,64,60,.36); }
    .bar { flex: 1; min-width: 0; background: var(--surface-highest); position: relative; transition: height 220ms ease; }
    .bar.active { background: var(--blood); }
    .bar span { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font: 700 8px/1 "Space Grotesk", sans-serif; color: var(--text-tertiary); }
    .heatmap { margin-top: 18px; display: grid; grid-template-columns: repeat(12,1fr); gap: 4px; }
    .heat-cell { aspect-ratio: 1; background: var(--surface-highest); }
    .heat-cell.l1 { background: #690000; }
    .heat-cell.l2 { background: #8b0000; }
    .heat-cell.l3 { background: #ffb4a8; }

    @media (max-width: 980px) {
      .prototype-shell { grid-template-columns: 1fr; align-items: start; }
      .brief-panel { max-width: none; }
      .stage { justify-content: flex-start; }
      .flow-hint { display: none; }
    }
    @media (max-width: 520px) {
      .prototype-shell { padding: 24px 12px 40px; gap: 24px; }
      .stage { width: 100%; height: 752px; overflow: hidden; justify-content: flex-start; }
      .phone-wrap { transform-origin: top left; transform: scale(.86); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

      session: [ ['Ergonomie','Gewicht, Wiederholungen und Log-Aktion liegen in einer ruhigen, einhändig bedienbaren Zone.'], ['Hierarchie','Das große END-Element wird zu einer sekundären Toolbar-Aktion.'], ['Feedback','Satz-Logging bestätigt direkt und erhält den Kontext der Übung.'] ],
      history: [ ['Scanbarkeit','Datum, Workout, Zeit und Volumen folgen auf jeder Zeile derselben Achse.'], ['Filter','Zeitraumsteuerung ersetzt die visuell schwere Kalenderleiste.'], ['Dichte','Mehr Verlauf bleibt sichtbar, ohne Text auf 8–9sp zu verkleinern.'] ],
      stats: [ ['Priorität','Eine Hero-Metrik führt; Diagramme folgen in klarer Reihenfolge.'], ['Vergleich','Zeitraumwechsel verändert dieselbe Struktur statt mehrere konkurrierende Module zu zeigen.'], ['Lesbarkeit','Weniger Rahmen und größere Chart-Flächen verbessern das schnelle Erfassen.'] ]
    };
    function Prototype() {
      const [screen,setScreen]=useState('altar'); const [mode,setMode]=useState('precision');
      const screenLabel={altar:'Altar',session:'Session',history:'History',stats:'Stats'}[screen];
      function navigate(target){ if(target==='profile') return; setScreen(target); }
      let content = screen==='altar'?<AltarScreen onStart={()=>setScreen('session')} onNavigate={navigate}/>:screen==='session'?<SessionScreen onBack={()=>setScreen('altar')}/>:screen==='history'?<HistoryScreen onNavigate={navigate}/>:<StatsScreen onNavigate={navigate}/>;
      return <main className="prototype-shell"><aside className="brief-panel"><div className="eyebrow">TrackGod · UX/UI Concept</div><h1>Harder.<br/>Calmer.<br/>Clearer.</h1><p>Eine professionelle Evolution des bestehenden Industrial-Brutalism-Systems – nicht freundlicher, sondern präziser und im täglichen Training schneller erfassbar.</p>
        <div className="control-block"><div className="control-label">Screen</div><div className="segmented">{['altar','session','history','stats'].map(id=><button key={id} className={`shell-button ${screen===id?'active':''}`} onClick={()=>setScreen(id)}>{id}</button>)}</div></div>
        <div className="control-block"><div className="control-label">Design-Intensität</div><div className="segmented">{[['precision','Precision'],['compact','Compact'],['cinematic','Cinematic']].map(([id,label])=><button key={id} className={`shell-button ${mode===id?'active':''}`} onClick={()=>setMode(id)}>{label}</button>)}</div><div className="mode-copy">{modeCopy[mode]}</div></div>
        <ul className="change-list">{screenChanges[screen].map(([title,copy],i)=><li key={title}><span className="change-index">0{i+1}</span><span><strong>{title}</strong><br/>{copy}</span></li>)}</ul>
      </aside><section className="stage"><div className="phone-wrap"><div className="flow-hint">Klickbar: Start Workout, ±, Log Set und Bottom Navigation</div><AndroidFrame><div className={`tg-app mode-${mode}`} data-screen={screenLabel}>{content}</div></AndroidFrame></div></section></main>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Prototype/>);
  </script>
</body>
</html>
